{% extends "base.html" %}
{% block title %}Amend Voucher — CollMgm{% endblock %}
{% block content %}
<h2 class="page-heading">Amend Voucher</h2>

<form method="get" action="/coll/amend" class="search-form">
  <input type="search" name="q" value="{{ q }}" placeholder="Bill number…"
         inputmode="numeric" autocomplete="off" autofocus>
  <button type="submit" class="btn btn-primary">Find</button>
</form>

{% if error %}
  <p class="alert alert-error">{{ error }}</p>
{% endif %}

<div class="action-row">
  <a class="btn btn-secondary" href="/coll/amendments">Amendment History</a>
  <a class="btn btn-secondary" href="/menu">Back to Menu</a>
</div>
{% endblock %}
