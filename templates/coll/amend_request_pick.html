{% extends "base.html" %}
{% block title %}Request Voucher Amendment — CollMgm{% endblock %}
{% block content %}
<h2 class="page-heading">Request Voucher Amendment</h2>

<form method="get" action="/coll/amend-request" class="search-form">
  <input type="search" name="q" value="{{ q }}" placeholder="Bill number…"
         inputmode="numeric" autocomplete="off" autofocus>
  <button type="submit" class="btn btn-primary">Find</button>
</form>

{% if error %}
  <p class="alert alert-error">{{ error }}</p>
{% endif %}

<div class="action-row">
  <a class="btn btn-secondary" href="/coll/amend-requests">Amendment Requests</a>
  <a class="btn btn-secondary" href="/menu">Back to Menu</a>
</div>
{% endblock %}
