<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a56db">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <title>Register — CollMgm</title>
  <script src="/static/password_toggle.js" defer></script>
</head>
<body class="login-body">
  <div class="login-card">
    <h1 class="login-title">CollMgm</h1>
    <p class="hint">First-time setup — create the distributor account.</p>
    {% if error %}
      <p class="alert alert-error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/register">
      <label for="name">Username</label>
      <input id="name" name="name" type="text" value="{{ submitted_name or '' }}" autocomplete="username"
             autocapitalize="off" autofocus required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6">
      <label for="confirm_password">Confirm Password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="6">
      <button type="submit" class="btn btn-primary btn-full">Create Distributor Account</button>
    </form>
    <p class="hint"><a href="/login">Back to sign in</a></p>
  </div>
</body>
</html>
