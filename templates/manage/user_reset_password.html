{% extends "base.html" %}
{% block title %}Reset Password — CollMgm{% endblock %}
{% block content %}
<h2 class="page-heading">Reset Password</h2>
<p class="meta-line"><strong>User:</strong> {{ target.name }}</p>

{% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}

<form method="post" action="/manage/users/{{ target.name | urlencode }}/reset-password" class="card">
  <label class="field-label">New Password
    <input type="password" name="new_password" required minlength="6" autocomplete="new-password" autofocus>
  </label>
  <label class="field-label">Confirm New Password
    <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
  </label>
  <p class="hint">The user must set their own password again the next time they log in.</p>

  <div class="action-row">
    <button type="submit" class="btn btn-primary">Reset Password</button>
    <a class="btn btn-secondary" href="/manage/users">Cancel</a>
  </div>
</form>
{% endblock %}
