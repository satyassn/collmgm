<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a56db">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <title>Forgot Password — CollMgm</title>
  <script src="/static/password_toggle.js" defer></script>
</head>
<body class="login-body">
  <div class="login-card">
    <h1 class="login-title">CollMgm</h1>
    <p class="hint">Reset the distributor password.</p>
    {% if error %}
      <p class="alert alert-error">{{ error }}</p>
    {% endif %}
    {% if step == 2 %}
    <form method="post" action="/forgot-password/reset">
      <input type="hidden" name="username" value="{{ username }}">
      <p><strong>Your secret question:</strong><br>{{ question }}</p>
      <label for="secret_answer">Answer</label>
      <input id="secret_answer" name="secret_answer" type="text" autocomplete="off"
             autocapitalize="off" autofocus required>
      <label for="new_password">New Password</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="6">
      <label for="confirm_password">Confirm New Password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="6">
      <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
    </form>
    {% else %}
    <form method="post" action="/forgot-password">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" value="{{ submitted_name or '' }}"
             autocomplete="username" autocapitalize="off" autofocus required>
      <button type="submit" class="btn btn-primary btn-full">Continue</button>
    </form>
    {% endif %}
    <p class="hint"><a href="/login">Back to sign in</a></p>
  </div>
</body>
</html>
